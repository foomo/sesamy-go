version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      github-actions:
        patterns:
          - '*'
    cooldown:
      default-days: 3

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    cooldown:
      default-days: 3
